name: Build C++ WebAssembly and deploy Ven IT Tech

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Boost headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
          mkdir -p .boost-headers
          cp -a /usr/include/boost .boost-headers/
      - name: Install Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.10'
      - name: Compile real C++ algorithms to WebAssembly
        run: |
          em++ day6_wasm.cpp -I .boost-headers -std=c++20 -O2 \
            -s WASM=1 -s SINGLE_FILE=1 -s MODULARIZE=1 \
            -s EXPORT_NAME=createDay6Module \
            -s EXPORTED_FUNCTIONS='["_day6_compute"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall"]' \
            -s ALLOW_MEMORY_GROWTH=1 -s ENVIRONMENT=web \
            -o day6_wasm.js
          test -s day6_wasm.js
      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='.boost-headers' \
            --exclude='_site' --exclude='server' --exclude='server_day6' \
            --exclude='server_day6.exe' ./ _site/
          test -s _site/index.html
          test -s _site/day6_wasm.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
